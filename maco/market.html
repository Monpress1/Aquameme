<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#060814;--ink:#eef2ff;--mu:#8d98c8;--line:rgba(150,170,255,.16);--cy:#3de8ff;--vi:#8b6bff;--mg:#ff4fd8;--go:#ffc933;--ok:#46f0a0;--bad:#ff5470;box-sizing:border-box;font-family:'Sora',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(900px 520px at 85% -10%,rgba(139,107,255,.24),transparent 60%),radial-gradient(700px 480px at -10% 8%,rgba(61,232,255,.14),transparent 60%),var(--bg);background-attachment:fixed;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(180deg,rgba(6,8,20,.92),rgba(6,8,20,.6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:8px;font:900 17px 'Orbitron',sans-serif;letter-spacing:.02em}
.brand span{color:var(--cy);margin-left:5px}
.wchip{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;font-weight:600}
.wchip b{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--go)}.wchip i{font-style:normal;color:var(--mu);font-size:12px}
.demo{margin:0 16px 8px;padding:8px 12px;border-radius:12px;background:rgba(255,201,51,.1);border:1px solid rgba(255,201,51,.3);color:#ffe9a0;font-size:12.5px;line-height:1.35}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px 16px}
h1.pg{font:900 26px/1.1 'Orbitron',sans-serif;margin:10px 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 16px;line-height:1.45}
.card{border-radius:24px;padding:18px;background:linear-gradient(160deg,rgba(32,36,96,.5),rgba(12,10,44,.7));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 50px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card+.card,.card+.row,.row+.card{margin-top:12px}
.btn{position:relative;display:block;width:100%;border:0;border-radius:16px;padding:15px;font:800 15px 'Sora',sans-serif;color:#04061a;cursor:pointer;text-align:center;background:linear-gradient(90deg,var(--cy),var(--vi) 60%,var(--mg));box-shadow:0 10px 30px rgba(139,107,255,.4);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.alt{margin-top:9px;background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.btn.gold{background:linear-gradient(90deg,#ffe27a,#ff9a2b);box-shadow:0 10px 30px rgba(255,170,40,.35)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:13px;border-radius:12px;margin:0}
.row{display:flex;gap:10px}.stat{flex:1;padding:12px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);text-align:left}
.stat small{display:block;color:var(--mu);font-size:11.5px;margin-bottom:4px}.stat b{font:700 18px 'Orbitron',sans-serif}
.stat svg{vertical-align:-4px;margin-right:4px}
.lab{margin:14px 0 8px;color:var(--mu);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;gap:10px}
.chip{padding:8px 4px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-weight:700;font-size:12px;text-align:center;transition:.2s}
.chip i{display:block;height:26px;border-radius:9px;margin-bottom:5px}.chip.on{border-color:var(--cy);box-shadow:0 0 18px rgba(61,232,255,.4);background:rgba(61,232,255,.08)}
.chip.dis{opacity:.45}.chip b{display:block;font:700 13px 'Orbitron',sans-serif}.chip small{display:block;color:var(--mu);font-size:10.5px;font-weight:600}
.big{font:900 46px 'Orbitron',sans-serif;margin:2px 0 10px;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl{margin:0;font:900 22px 'Orbitron',sans-serif;color:var(--mg)}
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:540px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:8px 6px;border-radius:26px;background:rgba(14,16,48,.82);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:14px}
.nav a.on{color:var(--cy)}.nav a.play{width:60px;height:60px;margin-top:-26px;border-radius:50%;justify-content:center;color:#04061a;background:linear-gradient(135deg,var(--cy),var(--vi) 60%,var(--mg));box-shadow:0 8px 26px rgba(139,107,255,.6);border:3px solid #0a0c26}
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin:0 0 14px}
.tabs button{flex:1;border:0;padding:10px 6px;border-radius:12px;background:none;color:var(--mu);font:700 13px 'Sora',sans-serif;cursor:pointer}.tabs button.on{background:linear-gradient(90deg,rgba(61,232,255,.2),rgba(139,107,255,.25));color:var(--ink)}
.pk{--c:var(--cy);position:relative;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:14px;margin-bottom:12px;border-radius:22px;background:linear-gradient(150deg,rgba(32,36,96,.45),rgba(10,8,40,.7));border:1px solid var(--line)}
.pk .ic{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 38%,transparent),rgba(255,255,255,.03) 70%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 20px color-mix(in srgb,var(--c) 18%,transparent)}
.pk h3{margin:0;font-size:15.5px;font-weight:800}.pk h3 em{font-style:normal;color:var(--go);margin-left:6px;font-family:'Orbitron',sans-serif;font-size:13px}
.pk p{margin:3px 0 10px;color:var(--mu);font-size:12.5px;line-height:1.35}
.pk .ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{display:flex;align-items:center;gap:6px;font:800 15px 'Orbitron',sans-serif;color:var(--go)}
.tag{position:absolute;top:-8px;right:14px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:800;color:#04061a;background:linear-gradient(90deg,var(--go),#ff9a2b)}
.inv{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}.inv .stat{flex:0 0 auto;min-width:78px;text-align:center}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(3,4,14,.72);backdrop-filter:blur(6px)}
.modal .card{width:min(440px,100%);text-align:center}.modal h2{margin:8px 0 2px;font-size:20px}.modal .m{color:var(--mu);font-size:13px;margin:4px 0}
.modal .ln{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(14,16,48,.95);border:1px solid var(--line);padding:9px 16px;border-radius:14px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90%;text-align:center}
.rar{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.rar.common{background:rgba(180,190,230,.18);color:#c7cff5}.rar.rare{background:rgba(61,232,255,.16);color:var(--cy)}.rar.epic{background:rgba(139,107,255,.22);color:#b9a6ff}.rar.legendary{background:rgba(255,201,51,.2);color:var(--go)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--cy);animation:sp 1s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mono{font-family:ui-monospace,Menlo,monospace;word-break:break-all;font-size:12px;color:var(--mu)}
.logo{margin:0;font:900 clamp(38px,11vw,56px)/.95 'Orbitron',sans-serif;font-style:italic;transform:skewX(-8deg);background:linear-gradient(100deg,#fff 0%,var(--cy) 38%,var(--vi) 70%,var(--mg) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(61,232,255,.45))}
.logo span{display:block;font-size:.78em}
.lk{display:flex;align-items:center;gap:14px;padding:14px;margin-top:10px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.lk b{display:block;font-size:15px}.lk small{color:var(--mu);font-size:12.5px}.lk svg{flex:none}

</style>

};
function svg(n,s,c){return '<svg viewBox="0 0 64 64" width="'+s+'" height="'+s+'"'+(c?' class="'+c+'"':'')+' aria-hidden="true">'+(D[n]||'')+'</svg>'}
function canvas(n,px){const c=document.createElement('canvas');c.width=c.height=px;const im=new Image();const p=new Promise(r=>{im.onload=()=>{c.getContext('2d').drawImage(im,0,0,px,px);r(c)}});im.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="'+px+'" height="'+px+'">'+D[n]+'</svg>');return{canvas:c,ready:p}}
const N={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',heroes:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',market:'<path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',rank:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8"/>'};
function nav(n){return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+N[n]+'</svg>'}
return{svg,canvas,nav}})();

</script>
<script>
(function(){
const C=window.CONFIG,CAT=window.CATALOG,DEMO=!C.API_BASE||!C.TREASURY;
const $=(s,r)=>(r||document).querySelector(s);
const short=a=>a?a.slice(0,6)+'…'+a.slice(-4):'';
const pad=h=>h.replace(/^0x/,'').toLowerCase().padStart(64,'0');
const hex=s=>'0x'+Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
function parseUnits(v,d){const p=String(v).split('.');return BigInt(p[0]+((p[1]||'').padEnd(d,'0').slice(0,d)))}
function fmt(b,d,mx){mx=mx==null?2:mx;let s=b.toString(),i,f='';if(d>0){s=s.padStart(d+1,'0');i=s.slice(0,-d);f=s.slice(-d).slice(0,mx).replace(/0+$/,'')}else i=s;return i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(f?'.'+f:'')}
const fmtT=s=>{s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')};

/* ---------------- wallet ---------------- */
const W={addr:null,kind:null,prov:null,chain:null,wrong:false,raw:null,dec:C.MACO_DECIMALS,sym:C.MACO_SYMBOL,fn:[]};
W.on=f=>W.fn.push(f);W.emit=()=>W.fn.forEach(f=>{try{f(W)}catch(e){}});
W.req=(m,p)=>W.prov.request({method:m,params:p||[]});
W.bal=()=>W.raw==null?'—':fmt(W.raw,W.dec==null?18:W.dec,2);
async function afterConnect(a){W.addr=a;localStorage.setItem('maco_w',W.kind);await W.refresh();
  if(W.prov&&W.prov.on&&W.kind!=='demo'){W.prov.on('accountsChanged',x=>{if(!x.length)W.disconnect();else{W.addr=x[0];W.refresh()}});W.prov.on('chainChanged',()=>W.refresh())}}
const wcId=()=>C.WC_PROJECT_ID||localStorage.getItem('maco_wc_id')||'';
async function wcProvider(connect){const id=wcId();if(!id)throw new Error('NEEDS_WC_ID');
  let mod;for(const u of ['https://esm.sh/@walletconnect/ethereum-provider@2.17.0','https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.17.0/+esm']){try{mod=await import(u);break}catch(e){}}
  if(!mod||!mod.EthereumProvider)throw new Error('Could not load WalletConnect. Check your connection and try again.');
  const o={projectId:id,showQrModal:true,metadata:{name:'MACO Rush',description:'MACO Rush',url:location.origin,icons:[]}};
  if(C.CHAIN_ID){o.chains=[C.CHAIN_ID];if(C.RPC_URL)o.rpcMap={[C.CHAIN_ID]:C.RPC_URL}}else o.optionalChains=[1];
  const p=await mod.EthereumProvider.init(o);
  if(connect&&!(p.session&&p.accounts&&p.accounts.length))await p.connect();
  p.on('disconnect',()=>{if(W.kind==='wc')W.disconnect()});return p}
W.connect=async kind=>{
  W.kind=kind;
  if(kind==='demo'){W.addr=localStorage.getItem('maco_demo_addr')||('0x'+Array.from({length:40},()=>'0123456789abcdef'[Math.random()*16|0]).join(''));localStorage.setItem('maco_demo_addr',W.addr);W.raw=5000n*10n**18n;W.dec=18;await afterConnect(W.addr);return}
  if(kind==='wc')W.prov=await wcProvider(true);
  else{if(!window.ethereum)throw new Error('No wallet found. Open this page in your wallet app browser, or install MetaMask.');W.prov=window.ethereum}
  const a=await W.req('eth_requestAccounts');if(!a||!a.length)throw new Error('No account returned');await afterConnect(a[0])};
W.restore=async()=>{const k=localStorage.getItem('maco_w');if(!k)return;
  if(k==='demo'&&DEMO){await W.connect('demo');return}
  if(k==='wc'){try{W.kind='wc';const p=await wcProvider(false);if(p.session&&p.accounts&&p.accounts.length){W.prov=p;await afterConnect(p.accounts[0])}else W.kind=null}catch(e){W.kind=null}return}
  if(k==='injected'&&window.ethereum){try{W.kind='injected';W.prov=window.ethereum;const a=await W.req('eth_accounts');if(a&&a.length)await afterConnect(a[0]);else W.kind=null}catch(e){W.kind=null}}};
W.disconnect=()=>{try{if(W.kind==='wc'&&W.prov&&W.prov.disconnect)W.prov.disconnect()}catch(e){}W.addr=null;W.raw=null;W.kind=null;localStorage.removeItem('maco_w');sessionStorage.removeItem('maco_tok');W.emit()};
W.ensureChain=async()=>{if(!C.CHAIN_ID||W.kind==='demo')return true;const want='0x'+C.CHAIN_ID.toString(16);
  if(parseInt(await W.req('eth_chainId'),16)===C.CHAIN_ID)return true;
  try{await W.req('wallet_switchEthereumChain',[{chainId:want}])}catch(e){if(e.code===4902||/unrecognized|not added/i.test(e.message||'')){await W.req('wallet_addEthereumChain',[{chainId:want,chainName:C.CHAIN_NAME||'MACO network',rpcUrls:[C.RPC_URL],blockExplorerUrls:C.EXPLORER?[C.EXPLORER]:undefined,nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18}}])}else throw e}
  await W.refresh();return !W.wrong};
W.refresh=async()=>{if(!W.addr)return;if(W.kind==='demo'){W.emit();return}
  try{W.chain=parseInt(await W.req('eth_chainId'),16);W.wrong=!!(C.CHAIN_ID&&W.chain!==C.CHAIN_ID);
    if(C.MACO_ADDRESS&&!W.wrong){if(W.dec==null){const d=await W.req('eth_call',[{to:C.MACO_ADDRESS,data:'0x313ce567'},'latest']);W.dec=parseInt(d,16)||18}
      const r=await W.req('eth_call',[{to:C.MACO_ADDRESS,data:'0x70a08231'+pad(W.addr)},'latest']);W.raw=BigInt(r&&r!=='0x'?r:'0x0')}}catch(e){console.warn(e)}
  W.emit()};
W.sign=async msg=>{if(W.kind==='demo')return '0xdemo';return W.req('personal_sign',[hex(msg),W.addr])};
W.pay=async amount=>{if(W.kind==='demo'||DEMO)return 'demo-'+Date.now();
  if(!await W.ensureChain())throw new Error('Wrong network');
  const raw=parseUnits(amount,W.dec==null?18:W.dec);if(W.raw!=null&&W.raw<raw)throw new Error('Not enough MACO');
  const hash=await W.req('eth_sendTransaction',[{from:W.addr,to:C.MACO_ADDRESS,data:'0xa9059cbb'+pad(C.TREASURY)+raw.toString(16).padStart(64,'0')}]);
  for(let i=0;i<90;i++){const r=await W.req('eth_getTransactionReceipt',[hash]);if(r){if(r.status==='0x1')break;throw new Error('Transaction failed')}await new Promise(r=>setTimeout(r,2000))}
  W.refresh();return hash};

/* ---------------- API (edge function contract; mock when DEMO) ---------------- */
const mk=()=>'maco_mock_'+(W.addr||'guest').toLowerCase();
const weekStart=()=>{const d=new Date(),t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());return t-((new Date(t).getUTCDay()+6)%7)*864e5};
function mload(){let p;try{p=JSON.parse(localStorage.getItem(mk()))}catch(e){}
  if(!p)p={timeSec:C.FREE_SECONDS,keys:0,chars:['robot'],equipped:'robot',inv:{magnet:0,shield:0,nitro:0,x2:0,shoe:0,jet:0},boosts:{jet:false,fuel:0},best:{score:0,coins:0},tot:{coins:0},week:{id:0,score:0,coins:0}};
  const w=weekStart();if(p.week.id!==w)p.week={id:w,score:0,coins:0};return p}
const msave=p=>{try{localStorage.setItem(mk(),JSON.stringify(p))}catch(e){}};
function seeded(n,seed){let s=seed;const r=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;return Array.from({length:n},()=>{let a='0x';for(let i=0;i<40;i++)a+='0123456789abcdef'[r()*16|0];const q=r();return{address:a,coins:Math.floor(60+9000*q*q*q),score:Math.floor(4000+90000*q*q),wc:Math.floor(20+1400*r()*r()),ws:Math.floor(2000+30000*r()*r())}})}
function mock(path,b){const p=mload();let r={};
  switch(path){
    case 'nonce':return {nonce:Math.random().toString(36).slice(2)};
    case 'login':return {token:'demo'};
    case 'profile':break;
    case 'purchase':{const e=CAT.items.find(x=>x.id===b.id)||CAT.chars.find(x=>x.id===b.id);if(!e)throw new Error('Unknown item');
      if(b.kind==='char'){if(!p.chars.includes(e.id))p.chars.push(e.id)}else{const g=e.grant;if(g.keys)p.keys+=g.keys;if(g.minutes)p.timeSec+=g.minutes*60;if(g.inv)for(const k in g.inv)p.inv[k]=(p.inv[k]||0)+g.inv[k];if(g.boost){if(g.boost.jet)p.boosts.jet=true;if(g.boost.fuel)p.boosts.fuel=Math.max(p.boosts.fuel,g.boost.fuel)}}break}
    case 'equip':if(p.chars.includes(b.charId))p.equipped=b.charId;break;
    case 'consumeTime':p.timeSec=Math.max(0,p.timeSec-(b.sec||0));break;
    case 'useLoadout':(b.items||[]).forEach(k=>{if(p.inv[k]>0)p.inv[k]--});break;
    case 'useKey':if(p.keys>0)p.keys--;break;
    case 'submitRun':p.keys+=b.keys||0;p.tot.coins+=b.coins||0;p.week.coins+=b.coins||0;p.best.coins=Math.max(p.best.coins,b.coins||0);p.best.score=Math.max(p.best.score,b.score||0);p.week.score=Math.max(p.week.score,b.score||0);p.timeSec=Math.max(0,p.timeSec-(b.sec||0));break;
    case 'leaderboard':{const wk=b.period==='week',sc=b.metric==='score',list=seeded(30,wk?77:19).map(x=>({address:x.address,value:wk?(sc?x.ws:x.wc):(sc?x.score:x.coins)}));
      if(W.addr)list.push({address:W.addr,value:wk?(sc?p.week.score:p.week.coins):(sc?p.best.score:p.tot.coins),me:true});
      list.sort((a,c)=>c.value-a.value);list.forEach((x,i)=>x.rank=i+1);return {entries:list.slice(0,50),me:list.find(x=>x.me)||null,resetsAt:weekStart()+7*864e5}}
    default:throw new Error('Unknown endpoint')}
  msave(p);return p}
const API={async call(path,body){
  if(DEMO)return mock(path,body||{});
  const r=await fetch(C.API_BASE.replace(/\/$/,'')+'/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.getItem('maco_tok')||'')},body:JSON.stringify(Object.assign({address:W.addr},body||{}))});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}};

/* ---------------- UI helpers ---------------- */
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function paintChip(){const e=$('#wchip');if(!e)return;e.innerHTML=W.addr?Icons.svg('mcoin',18)+'<b>'+W.bal()+'</b><i>'+short(W.addr)+'</i>':'Connect wallet'}
function header(){const h=document.createElement('header');h.className='top';h.innerHTML='<a class="brand" href="index.html">'+Icons.svg('mcoin',30)+'<b>MACO<span>RUSH</span></b></a><a class="wchip" id="wchip" href="connect.html"></a>';document.body.prepend(h);paintChip();
  if(DEMO){const d=document.createElement('div');d.className='demo';d.textContent='Demo mode: payments and progress are simulated in this browser until the treasury wallet and edge function are set in config.js.';h.after(d)}}
function nav(a){const n=document.createElement('nav');n.className='nav';const L=[['index.html','home','Home','home'],['characters.html','heroes','Heroes','heroes'],['game.html','play','','play'],['market.html','market','Market','market'],['leaderboard.html','rank','Ranks','rank']];
  n.innerHTML=L.map(l=>'<a href="'+l[0]+'" class="'+(l[1]==='play'?'play ':'')+(a===l[1]?'on':'')+'">'+Icons.nav(l[1])+(l[2]?'<span>'+l[2]+'</span>':'')+'</a>').join('');document.body.appendChild(n)}
function busy(msg){let m=$('#busy');if(!m){m=document.createElement('div');m.id='busy';m.className='modal';m.style.alignItems='center';document.body.appendChild(m)}m.innerHTML='<div class="card"><div class="spin"></div><b>'+msg+'</b></div>'}
function unbusy(){const m=$('#busy');if(m)m.remove()}
function confirmBuy(e,kind){return new Promise(res=>{const m=document.createElement('div');m.className='modal';
  const need=parseUnits(e.price,W.dec==null?18:W.dec),low=W.raw!=null&&W.raw<need,unk=W.raw==null&&!DEMO;
  m.innerHTML='<div class="card"><div>'+(kind==='char'?'<span class="rar '+e.rarity+'">'+e.rarity+'</span>':Icons.svg(e.icon,64))+'</div><h2>'+e.name+(e.qty?' '+e.qty:'')+'</h2><p class="m">'+(e.desc||'')+'</p><div class="ln"><span>Price</span><span class="price">'+Icons.svg('mcoin',18)+e.price+' MACO</span></div><div class="ln"><span>Your balance</span><span>'+W.bal()+' MACO</span></div>'+(low?'<p class="bad m">Not enough MACO.</p>':'')+(unk?'<p class="bad m">Switch to the right network on the Wallet page first.</p>':'')+'<button class="btn gold" id="cy"'+(low||unk?' disabled':'')+'>Pay '+e.price+' MACO</button><button class="btn alt" id="cn">Cancel</button></div>';
  document.body.appendChild(m);$('#cn',m).onclick=()=>{m.remove();res(false)};$('#cy',m).onclick=()=>{m.remove();res(true)}})}
async function buy(e,kind){
  if(!W.addr){location.href='connect.html?next='+encodeURIComponent(location.pathname.split('/').pop()||'index.html');return null}
  if(!await confirmBuy(e,kind))return null;
  try{busy('Confirm in your wallet…');const tx=await W.pay(e.price);busy('Verifying payment…');const r=await API.call('purchase',{id:e.id,kind:kind||'item',tx});unbusy();App.P=r;toast('Purchase complete');return r}
  catch(x){unbusy();toast(x&&x.code===4001?'Payment cancelled':(x&&x.message)||'Payment failed');return null}}
async function init(o){o=o||{};if(o.header!==false)header();if(o.nav!==false)nav(o.page);
  await W.restore();W.on(paintChip);paintChip();
  if(o.need&&!W.addr){location.replace('connect.html?next='+encodeURIComponent(location.pathname.split('/').pop()||'index.html'));return null}
  if(W.addr){try{App.P=await API.call('profile')}catch(e){toast(e.message)}}
  return App.P||null}
window.App={W,API,DEMO,wcId,init,toast,buy,short,fmt,fmtT,parseUnits,busy,unbusy,P:null};
})();

</script>
<script>

let tab=(location.hash||'#time').slice(1);if(!['time','power','boost'].includes(tab))tab='time';
const NAMES={time:'Time & keys',power:'Power-ups',boost:'Boosts'},$=s=>document.querySelector(s);
const col=e=>e.cat==='power'?CATALOG.PU[Object.keys(e.grant.inv)[0]].c:({key:'#ffc933',clock:'#3de8ff',jetpack:'#8b6bff',fuel:'#ff9a2b'})[e.icon]||'#3de8ff';
function render(){const P=App.P;
  $('#inv').innerHTML=P?'<div class="inv"><div class="stat"><small>Time</small><b>'+App.fmtT(P.timeSec)+'</b></div><div class="stat"><small>Keys</small><b>'+P.keys+'</b></div>'+Object.keys(CATALOG.PU).map(k=>'<div class="stat"><small>'+CATALOG.PU[k].name+'</small><b>'+Icons.svg(k,18)+P.inv[k]+'</b></div>').join('')+'</div>':'';
  $('#tabs').innerHTML=Object.keys(NAMES).map(k=>'<button class="'+(k===tab?'on':'')+'" data-t="'+k+'">'+NAMES[k]+'</button>').join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;history.replaceState(null,'','#'+tab);render()});
  $('#list').innerHTML=CATALOG.items.filter(e=>e.cat===tab).map(e=>{const own=P&&e.owned&&e.owned(P),lk=P&&e.locked&&e.locked(P);
    const act=own?'<span class="ok" style="font-weight:800;font-size:13px">Owned</span>':lk?'<span style="color:var(--mu);font-size:12px">'+lk+'</span>':'<button class="btn sm gold" data-id="'+e.id+'">Buy</button>';
    return '<div class="pk" style="--c:'+col(e)+'">'+(e.tag?'<span class="tag">'+e.tag+'</span>':'')+'<div class="ic">'+Icons.svg(e.icon,52)+'</div><div><h3>'+e.name+'<em>'+e.qty+'</em></h3><p>'+e.desc+'</p><div class="ft"><span class="price">'+Icons.svg('mcoin',18)+e.price+'</span>'+act+'</div></div></div>'}).join('');
  $('#list').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{const e=CATALOG.items.find(x=>x.id===b.dataset.id);const r=await App.buy(e,'item');if(r)render()})}
App.init({page:'market'}).then(()=>{App.W.on(render);render()});
</script>
