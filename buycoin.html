<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buy AQUAM | AquaCoinX</title>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class'
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
    :root { 
        --bg-dark: #0b111b; 
        --card-dark: #131b29; 
        --border-dark: #1e293b; 
        --text-dark: #ffffff; 
        
        --bg-light: #f8fafc;
        --card-light: #ffffff;
        --border-light: #e2e8f0;
        --text-light: #0f172a;

        --primary: #3b82f6; 
    }
    
    body { 
        font-family: 'Manrope', sans-serif; 
        -webkit-tap-highlight-color: transparent; 
        margin: 0; 
        padding-bottom: 110px;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    html.dark body { background: var(--bg-dark); color: var(--text-dark); }
    html:not(.dark) body { background: var(--bg-light); color: var(--text-light); }

    .card-bg { 
        border-radius: 1.25rem; 
        transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    html.dark .card-bg { background: var(--card-dark); border: 1px solid var(--border-dark); }
    html:not(.dark) .card-bg { background: var(--card-light); border: 1px solid var(--border-light); shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

    .input-field { 
        border-radius: 14px; 
        padding: 16px; 
        width: 100%; 
        outline: none; 
        font-weight: 600; 
        transition: all 0.2s ease;
    }
    html.dark .input-field { background: var(--card-dark); border: 1px solid var(--border-dark); color: var(--text-dark); }
    html:not(.dark) .input-field { background: #f1f5f9; border: 1px solid var(--border-light); color: var(--text-light); }
    .input-field:focus { border-color: var(--primary); }

    .nav-item { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        font-size: 0.65rem; 
        gap: 4px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: 0.2s; 
    }
    html.dark .nav-item { color: #94a3b8; }
    html:not(.dark) .nav-item { color: #64748b; }
    .nav-item.active { color: var(--primary) !important; }
    .nav-item i { font-size: 1.2rem; }

    .battery-pulse { animation: pulse-green 2s infinite; color: #22c55e; }
    @keyframes pulse-green { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    html.dark .swal2-popup-custom { background: #131b29 !important; border: 1px solid #1e293b !important; border-radius: 1.25rem !important; color: #ffffff !important; }
    html.dark .swal2-title-custom { color: #ffffff !important; }
    html:not(.dark) .swal2-popup-custom { background: #ffffff !important; border: 1px solid #e2e8f0 !important; border-radius: 1.25rem !important; color: #0f172a !important; }
    html:not(.dark) .swal2-title-custom { color: #0f172a !important; }
</style>
</head>

<body class="select-none">

<header class="px-5 py-4 flex justify-between items-center sticky top-0 z-30 border-b transition-colors duration-300 dark:bg-[#0b111b]/90 bg-white/90 backdrop-blur-md dark:border-gray-800/40 border-gray-200">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/30 flex items-center justify-center">
            <i class="fa-solid fa-coins text-blue-500 text-xs"></i>
        </div>
        <span class="font-bold text-sm tracking-tight dark:text-white text-gray-900">Buy AQUAM</span>
    </div>

    <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" class="w-9 h-9 rounded-full dark:bg-gray-800 bg-gray-100 flex items-center justify-center border dark:border-gray-700 border-gray-200 transition active:scale-95">
            <i id="themeIcon" class="fa-solid fa-moon text-yellow-400"></i>
        </button>
        <div id="ton-connect"></div>
    </div>
</header>

<main class="px-5 space-y-5 mt-2">

    <!-- LIVE USER BALANCE DISPLAY -->
    <div class="py-4 space-y-2">
        <div class="flex flex-col items-center justify-center">
            <div class="flex items-center gap-2 mb-1 opacity-70">
                <span class="text-xs font-bold uppercase tracking-widest dark:text-gray-400 text-gray-500">Current AQUAM Balance</span>
                <i class="fa-solid fa-battery-full text-[10px] battery-pulse"></i>
            </div>

            <div class="flex items-baseline gap-1">
                <span class="text-4xl font-black tracking-tighter dark:text-white text-gray-900" id="balAQUAM">0.00</span>
                <span class="text-lg font-bold text-blue-500">AQUAM</span>
            </div>

            <div class="flex items-center gap-1 mt-1 opacity-60">
                <span class="text-xs font-semibold dark:text-gray-300 text-gray-700" id="balTON">0.00</span>
                <span class="text-[10px] font-bold dark:text-gray-400 text-gray-500">TON</span>
            </div>
        </div>

        <div class="flex justify-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/5 border border-blue-500/10">
                <span id="shortAddr" class="text-[10px] font-mono text-blue-500">Not Connected</span>
            </div>
        </div>
    </div>

    <!-- BUY COIN FORM -->
    <div class="card-bg p-5 space-y-4">
        <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-sm dark:text-white text-gray-900 uppercase tracking-wider">Order AQUAM</h3>
            <span class="text-[11px] font-bold px-2 py-1 rounded bg-blue-500/10 text-blue-500 border border-blue-500/20">
                1 AQUAM = ₦0.0056
            </span>
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs dark:text-gray-400 text-gray-500 font-bold uppercase">Payment Amount (NGN)</label>
                <span class="text-[10px] font-semibold text-blue-500" id="minNgnLabel">Fetching exchange rate...</span>
            </div>
            <div class="relative">
                <input id="payAmount" type="number" oninput="calculateTokens()" value="2000" class="input-field text-xl font-bold pr-16">
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-extrabold text-blue-500">NGN</span>
            </div>
        </div>

        <input id="payEmail" type="hidden" value="customer@aquacoinx.com">

        <div class="dark:bg-gray-900/60 bg-gray-100 p-4 rounded-xl space-y-2 dark:border-gray-800/80 border-gray-200 border text-xs">
            <div class="flex justify-between text-sm dark:text-white text-gray-900 font-black">
                <span>You Receive:</span>
                <span id="netAquam" class="text-green-500">0.00 AQUAM</span>
            </div>
        </div>

        <button id="payBtn" onclick="executePaystackPayment()" class="w-full py-4 bg-green-600 hover:bg-green-500 active:scale-95 rounded-xl font-extrabold text-white shadow-lg shadow-green-600/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-credit-card"></i> Pay With Bank
        </button>
    </div>

    <!-- LOCALSTORAGE PURCHASE HISTORY -->
    <div class="card-bg p-5">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-sm dark:text-gray-400 text-gray-500 uppercase tracking-wider">Purchase History</h3>
            <i class="fa-solid fa-receipt dark:text-gray-600 text-gray-400"></i>
        </div>
        
        <div id="tx-history" class="space-y-3">
            <!-- Dynamically Rendered -->
        </div>
        
    </div>

</main>
<br><br>
<center><small>secured by paystack</small></center>


<script>
// --- CONFIGURATION ---
const AQUA_MASTER = "0:3bd4bebfed463f684358499fdc7db172533f12b2e7f14d6c8de4073cd01b57f1"; 
const API = "https://tonapi.io/v2";
const SUPABASE_URL = "https://ptllbgdixhesptlkqrqa.supabase.co";
const SUPABASE_ENDPOINT = "https://ptllbgdixhesptlkqrqa.supabase.co/functions/v1/Buycoin";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0bGxiZ2RpeGhlc3B0bGtxcnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MzU5MzMsImV4cCI6MjA4NTUxMTkzM30.KGa_rx-CttqT6foXSfHVF2-SiQalOcpWTtRMsdT9R_c";
const PAYSTACK_PUBLIC_KEY = "pk_live_988851c6dff5a63928310640a0265fe5b7d254af";
const CG_API_KEY = "CG-fVHSbCQ5EZmvuXrwM1K8p1BL";

const AQUAM_PRICE_NGN = 0.0056;
const SERVICE_FEE_PERCENT = 0.10; // 10%

// Dynamic Exchange Rate Storage (Default fallback rate is ₦1,345 per USD)
let ngnPerUsd = 1345; 
let minPurchaseNgn = 1345;
const MIN_PURCHASE_USD = 1.00;

// Initialize Supabase Client
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userAddress = "";
let jettonWallet = "";
let balances = { TON: 0, AQUAM: 0 };
let netAquamToReceive = 0;
let txHistory = JSON.parse(localStorage.getItem('aqua_tx_history')) || [];

// --- FETCH REALTIME USD/NGN EXCHANGE RATE VIA COINGECKO ---
async function fetchExchangeRate() {
    const minLabel = document.getElementById("minNgnLabel");
    try {
        const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=ngn&x_cg_demo_api_key=${CG_API_KEY}`);
        const data = await response.json();
        
        if (data && data.tether && data.tether.ngn) {
            ngnPerUsd = Math.ceil(data.tether.ngn);
            minPurchaseNgn = ngnPerUsd * MIN_PURCHASE_USD;
            
            minLabel.innerText = `Min: ₦${minPurchaseNgn.toLocaleString()} ($1 = ₦${ngnPerUsd.toLocaleString()})`;
            
            // Set input default value to minimum rate if empty or under current min
            const payInput = document.getElementById("payAmount");
            if (!payInput.value || parseFloat(payInput.value) < minPurchaseNgn) {
                payInput.value = minPurchaseNgn;
            }
            calculateTokens();
            return;
        }
    } catch (error) {
        console.warn("CoinGecko API fetch failed, using fallback rate:", error);
    }
    
    // Fallback UI update
    minPurchaseNgn = ngnPerUsd * MIN_PURCHASE_USD;
    minLabel.innerText = `Min: ₦${minPurchaseNgn.toLocaleString()} ($1 = ₦${ngnPerUsd.toLocaleString()})`;
    calculateTokens();
}

// --- THEME ENGINE ---
const html = document.documentElement;
const themeIcon = document.getElementById('themeIcon');

if (localStorage.getItem('theme') === 'light') {
    html.classList.remove('dark');
} else {
    html.classList.add('dark');
}
updateThemeIcon();

function toggleTheme() {
    html.classList.toggle('dark');
    const isDark = html.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon();
}

function updateThemeIcon() {
    const isDark = html.classList.contains('dark');
    if (themeIcon) {
        themeIcon.className = isDark ? 'fa-solid fa-moon text-yellow-400' : 'fa-solid fa-sun text-orange-500';
    }
}

// Custom SweetAlert Helper
const showToast = (title, text, icon = 'success') => {
    Swal.fire({
        title: title,
        html: text,
        icon: icon,
        showClass: {
            popup: 'animate__animated animate__fadeInDown animate__faster'
        },
        hideClass: {
            popup: 'animate__animated animate__fadeOutUp animate__faster'
        },
        confirmButtonColor: '#22c55e',
        customClass: {
            popup: 'swal2-popup-custom',
            title: 'swal2-title-custom'
        }
    });
};

// --- TON CONNECT SETUP ---
const tonUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: "https://raw.githubusercontent.com/Monpress1/Aquameme/main/tonconnect-manifest.json",
  buttonRootId: "ton-connect"
});

function getConnectedAddress() {
    if (tonUI && tonUI.account && tonUI.account.address) {
        return tonUI.account.address;
    }
    if (tonUI && tonUI.wallet && tonUI.wallet.account && tonUI.wallet.account.address) {
        return tonUI.wallet.account.address;
    }
    return userAddress || null;
}

tonUI.onStatusChange(async wallet => {
    if (!wallet) {
        userAddress = "";
        document.getElementById("shortAddr").innerText = "Not Connected";
        document.getElementById("balTON").innerText = "0.00";
        document.getElementById("balAQUAM").innerText = "0.00";
        return;
    }
    
    userAddress = wallet.account.address;
    const friendlyAddr = new TonWeb.utils.Address(userAddress).toString(true, true, true);
    document.getElementById("shortAddr").innerText = friendlyAddr.slice(0, 4) + "..." + friendlyAddr.slice(-4);
    
    await loadBalances();
});

// --- LOAD BALANCES & HISTORY ---
async function loadBalances() {
    if(!userAddress) return;
    try {
        const acc = await fetch(`${API}/accounts/${userAddress}`).then(r => r.json());
        if (acc && acc.balance !== undefined) {
            balances.TON = acc.balance / 1e9;
        }
        
        const jets = await fetch(`${API}/accounts/${userAddress}/jettons`).then(r => r.json());
        const aqua = jets.balances ? jets.balances.find(j => j.jetton.address === AQUA_MASTER) : null;
        
        if (aqua) {
            balances.AQUAM = Number(aqua.balance) / 1e9;
            jettonWallet = new TonWeb.utils.Address(aqua.wallet_address.address).toString(true, true, true);
        } else {
            balances.AQUAM = 0;
        }
        
        updateDisplay();
    } catch(e) { 
        console.error("Balance Update Error:", e); 
    }
}

function updateDisplay() {
    document.getElementById("balTON").innerText = balances.TON.toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById("balAQUAM").innerText = balances.AQUAM.toLocaleString(undefined, {maximumFractionDigits: 2});
}

// --- CALCULATIONS ---
function calculateTokens() {
    const payAmount = parseFloat(document.getElementById("payAmount").value) || 0;

    if (payAmount <= 0) {
        document.getElementById("netAquam").innerText = "0.00 AQUAM";
        netAquamToReceive = 0;
        return;
    }

    const grossAquam = payAmount / AQUAM_PRICE_NGN;
    const feeAquam = grossAquam * SERVICE_FEE_PERCENT;
    netAquamToReceive = grossAquam - feeAquam;

    document.getElementById("netAquam").innerText = `${netAquamToReceive.toLocaleString(undefined, {maximumFractionDigits: 2})} AQUAM`;
}

// --- HISTORY DISPLAY FROM LOCALSTORAGE ---
function renderHistory() {
    const container = document.getElementById("tx-history");
    if (!txHistory || txHistory.length === 0) {
        container.innerHTML = `<div class="text-center py-4"><p class="text-xs dark:text-gray-600 text-gray-400">No purchase history found.</p></div>`;
        return;
    }

    container.innerHTML = "";
    txHistory.slice().reverse().forEach(item => {
        container.innerHTML += `
            <div class="flex items-center justify-between text-xs dark:bg-gray-800/30 bg-gray-50 p-3 rounded-lg border-l-2 border-green-500">
                <div>
                    <div class="font-bold dark:text-white text-gray-900">+${Number(item.aquam).toLocaleString(undefined, {maximumFractionDigits: 2})} AQUAM</div>
                    <div class="dark:text-gray-500 text-gray-400 text-[10px]">${item.date} • Ref: ${item.ref.slice(0, 8)}...</div>
                </div>
                <div class="text-right">
                    <div class="font-bold text-green-500">₦${Number(item.ngn).toLocaleString()}</div>
                    <div class="text-[9px] dark:text-gray-400 text-gray-500 font-mono">${item.status}</div>
                </div>
            </div>
        `;
    });
}

function saveTransaction(record) {
    txHistory.push(record);
    localStorage.setItem('aqua_tx_history', JSON.stringify(txHistory));
    renderHistory();
}

// --- PAYSTACK INTEGRATION ---
function executePaystackPayment() {
    const activeAddress = getConnectedAddress();

    if (!activeAddress) {
        showToast("Wallet Required", "Please connect your TON wallet first to make a purchase.", "warning");
        return;
    }

    const payAmount = parseFloat(document.getElementById("payAmount").value);
    const email = document.getElementById("payEmail").value.trim();

    if (!payAmount || payAmount < minPurchaseNgn) {
        showToast(
            "Minimum Limit", 
            `Minimum purchase amount is <b>₦${minPurchaseNgn.toLocaleString()}</b> ($1 USD = ₦${ngnPerUsd.toLocaleString()}).`, 
            "error"
        );
        return;
    }

    const friendlyAddr = new TonWeb.utils.Address(activeAddress).toString(true, true, true);
    const btn = document.getElementById("payBtn");
    btn.disabled = true;

    function handlePaystackSuccess(response) {
        btn.disabled = false;
        
        const usdVal = (payAmount / ngnPerUsd).toFixed(2);
        
        const newTx = {
            ref: response.reference,
            ngn: payAmount,
            aquam: netAquamToReceive,
            date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            status: "Successful"
        };

        saveTransaction(newTx);

        // 1. Direct Insert into Supabase Table
        supabaseClient.from('purchases').insert([
            {
                reference: response.reference,
                wallet_address: friendlyAddr,
                amount_ngn: payAmount,
                aquam_amount: netAquamToReceive,
                usd_equivalent: usdVal
            }
        ]).then(({ error }) => {
            if (error) console.error("Supabase insert error:", error);
        });

        // 2. Dispatch to Supabase Edge Function
        fetch(SUPABASE_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
                reference: response.reference,
                walletAddress: friendlyAddr,
                rawAddress: activeAddress,
                amountNgn: payAmount,
                aquamAmount: netAquamToReceive
            })
        }).catch(e => console.error("Edge Function error:", e));

        // Feedback Popup
        showToast(
            "Payment Successful!", 
            `<p class="text-sm"><b>Ref:</b> ${response.reference}</p>
             <p class="text-sm text-green-500 mt-2"><b>+${netAquamToReceive.toFixed(2)} AQUAM</b> will be credited to your wallet!</p>`, 
            "success"
        );
        
        setTimeout(loadBalances, 3000);
    }

    function handlePaystackClose() {
        btn.disabled = false;
        showToast("Payment Cancelled", "The payment session was closed.", "info");
    }

    // Initialize Paystack with pre-declared callback references
    const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: email,
        amount: Math.round(payAmount * 100),
        currency: "NGN",
        metadata: {
            custom_fields: [
                { display_name: "Wallet Address", variable_name: "wallet_address", value: friendlyAddr },
                { display_name: "Net AQUAM Tokens", variable_name: "net_aquam", value: netAquamToReceive }
            ]
        },
        callback: handlePaystackSuccess,
        onClose: handlePaystackClose
    });

    handler.openIframe();
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
    await fetchExchangeRate();
    renderHistory();
});
</script>
</body>
</html>
